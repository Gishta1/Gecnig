<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Viewport сразу для всех устройств, включая планшеты -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unity Web Player | Gecnig</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        /* Используем dvh — динамическая высота, учитывает адрес-бар на мобиле/планшете */
        height: 100dvh;
        overflow: hidden;
        background: #000;
        /* Блокируем нативный скролл и зум жестами */
        touch-action: none;
        -webkit-overflow-scrolling: touch;
      }

      #unity-container {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        /* Запасной вариант для браузеров без dvh */
        height: 100vh;
        height: 100dvh;
      }

      #unity-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100% !important;
        height: 100% !important;
        /* dvh чтобы не уезало под адрес-бар Safari/Chrome на планшете */
        height: 100dvh !important;
        display: block;
        /* Убираем сглаживание при масштабировании */
        image-rendering: pixelated;
      }

      /* Загрузочный бар поверх канваса */
      #unity-loading-bar {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }

      #unity-warning {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        z-index: 100;
      }

      #unity-footer {
        position: fixed;
        bottom: 0; left: 0;
        width: 100%;
        z-index: 10;
        /* Отступ для устройств с вырезом/закруглением (safe area) */
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Gecnig</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Gecnig.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Gecnig.data",
        frameworkUrl: buildUrl + "/Gecnig.framework.js",
        codeUrl: buildUrl + "/Gecnig.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Gecnig",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Единая функция подгонки размера канваса под окно
      function resizeCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
      }

      // Всегда добавляем viewport (не только для мобилок)
      // — уже прописан в <head>, поэтому JS-блок оставляем только для className
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      resizeCanvas();

      // Перестраиваем при смене ориентации и ресайзе (планшет, fold-телефоны)
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", function() {
        // Небольшая задержка: браузер обновляет innerWidth/Height не мгновенно
        setTimeout(resizeCanvas, 200);
      });

      canvas.style.background = "url('" + buildUrl + "/Gecnig.jpg') center / cover";
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
